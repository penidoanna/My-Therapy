<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Create Your Account – My Therapy</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}">
        <style>
            body {
                background-color: #f5f7fb;
            }
            .option-card {
                transition: 0.2s ease;
                border-radius: 1rem;
                cursor: pointer;
            }
            .option-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            }
        </style>
    </head>

    <body>

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <nav class="navbar navbar-light bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                    <i class="fa-solid fa-heart-pulse me-2 text-primary"></i>
                    <span>My Therapy</span>
                </a>
            </div>
        </nav>

        <div class="container py-5">
            <div class="text-center mb-4">
                <h1 class="fw-bold">Create your account</h1>
                <p class="text-muted">Choose how you want to use My Therapy</p>
            </div>

            <div class="row g-4 justify-content-center">

                <!-- Patient Option -->
                <div class="col-md-5">
                    <a th:href="@{/patients/create}" class="text-decoration-none text-dark">
                        <div class="card option-card shadow-sm border-0 p-4 text-center">
                            <div class="mb-3">
                                <i class="fa-solid fa-user text-primary" style="font-size: 2.5rem;"></i>
                            </div>
                            <h4 class="fw-bold mb-2">I'm a Patient</h4>
                            <p class="text-muted mb-0">
                                Book sessions, manage appointments, and browse our therapeutic resources.
                            </p>
                        </div>
                    </a>
                </div>

                <!-- Psychologist Option -->
                <div class="col-md-5">
                    <a th:href="@{/psychologists/create}" class="text-decoration-none text-dark">
                        <div class="card option-card shadow-sm border-0 p-4 text-center">
                            <div class="mb-3">
                                <i class="fa-solid fa-user-doctor text-primary" style="font-size: 2.5rem;"></i>
                            </div>
                            <h4 class="fw-bold mb-2">I'm a Psychologist</h4>
                            <p class="text-muted mb-0">
                                Manage clients, define your availability, and grow your practice online.
                            </p>
                        </div>
                    </a>
                </div>

            </div>
        </div>

        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>

    </body>
</html>
