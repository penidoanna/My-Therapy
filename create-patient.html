<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Register as a Patient – My Therapy</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}">
    </head>

    <body class="bg-light">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container py-5">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-7">

                    <h1 class="h3 fw-bold mb-3 text-center">Create Your Patient Account</h1>
                    <p class="text-muted text-center mb-4">
                        Register to book sessions, pay securely, and access our therapeutic resources.
                    </p>

                    <!-- FORM -->
                    <form th:action="@{/patients/create}" 
                          th:object="${patient}" 
                          method="post"
                          class="card shadow-sm border-0">

                        <div class="card-body p-4">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" th:field="*{fName}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('fName')}" th:errors="*{fName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" th:field="*{lName}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('lName')}" th:errors="*{lName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" th:field="*{phone}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Country</label>
                                    <input type="text" class="form-control" th:field="*{country}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" th:field="*{password}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" name="confirmPassword" required>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label">Additional Notes</label>
                                    <textarea class="form-control" th:field="*{notes}" rows="2" placeholder="(Optional)"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer d-flex justify-content-between bg-white">
                            <a th:href="@{/login}" class="btn btn-link text-muted">Back to login</a>
                            <button class="btn btn-primary" type="submit">Create Account</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
