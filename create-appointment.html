<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Psychologists - Therapy Management</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-user-md me-2"></i>Psychologists</h2>
                <a href="/psychologists/create" class="btn btn-success">
                    <i class="fas fa-plus me-1"></i>Add Psychologist
                </a>
            </div>

            <div class="row">
                <div th:each="psychologist : ${psychologists}" class="col-md-6 col-lg-4 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body text-center">
                            <div class="mb-3">
                                <i class="fas fa-user-md fa-3x text-primary"></i>
                            </div>
                            <h5 th:text="${psychologist.fName + ' ' + psychologist.lName}">Dr. John Smith</h5>
                            <p class="text-muted mb-2" th:text="${psychologist.specialty}">Clinical Psychology</p>
                            <p class="mb-1">
                                <i class="fas fa-envelope me-1"></i>
                                <span th:text="${psychologist.email}">john@example.com</span>
                            </p>
                            <p class="mb-1">
                                <i class="fas fa-phone me-1"></i>
                                <span th:text="${psychologist.phoneNumber}">+123456789</span>
                            </p>
                            <p class="mb-3">
                                <i class="fas fa-id-card me-1"></i>
                                <span th:text="${psychologist.professionalReg}">REG12345</span>
                            </p>
                            <div class="btn-group w-100">
                                <button class="btn btn-outline-primary btn-sm">
                                    <i class="fas fa-edit me-1"></i>Edit
                                </button>
                                <button class="btn btn-outline-danger btn-sm">
                                    <i class="fas fa-trash me-1"></i>Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${psychologists.empty}" class="col-12">
                    <div class="card shadow-sm text-center py-5">
                        <i class="fas fa-user-md fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">No Psychologists Found</h5>
                        <p class="text-muted mb-3">Add your first psychologist to get started</p>
                        <a href="/psychologists/create" class="btn btn-primary">Add First Psychologist</a>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
