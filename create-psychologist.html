<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Register as a Psychologist – My Therapy</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
        <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}"/>
    </head>

    <body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container py-5">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Success message -->
            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

                    <h1 class="h3 fw-bold mb-3 text-center">Join My Therapy as a Psychologist</h1>
                    <p class="text-muted text-center mb-4">
                        Create your profile to start receiving appointments.
                    </p>

                    <!-- FORM -->
                    <form th:action="@{/psychologists/create}" 
                          method="post" 
                          th:object="${psychologist}" 
                          class="card shadow-sm border-0">

                        <div class="card-body p-4">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" th:field="*{fName}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('fName')}" th:errors="*{fName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" th:field="*{lName}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('lName')}" th:errors="*{lName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" th:field="*{phoneNumber}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Professional Registration No.</label>
                                    <input type="text" class="form-control" th:field="*{professionalReg}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('professionalReg')}" th:errors="*{professionalReg}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Specialty</label>
                                    <input type="text" class="form-control" th:field="*{specialty}"
                                           placeholder="e.g. CBT, Trauma, Clinical Psychology" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('specialty')}" th:errors="*{specialty}"></div>
                                </div>
                                
                                <div class="col-md-6">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" th:field="*{password}" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" name="confirmPassword" required>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer d-flex justify-content-between align-items-center bg-white">
                            <a th:href="@{/psychologists}" class="btn btn-link text-muted">Back to list</a>
                            <button type="submit" class="btn btn-primary">
                                Complete registration →
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
