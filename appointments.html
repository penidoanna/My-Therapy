<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Appointments – My Therapy</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    </head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container py-4">
            <h1 class="h3 mb-3">Appointments</h1>
            <p class="text-muted">
                This page will show upcoming and past appointments for the logged-in user.
            </p>
            <div th:if="${appointments == null or #lists.isEmpty(appointments)}" class="alert alert-info">
                No appointments to display yet.
            </div>
            <table class="table table-sm" th:if="${appointments != null and !#lists.isEmpty(appointments)}">
                <thead>
                    <tr>
                        <th>Date &amp; time</th>
                        <th>Patient</th>
                        <th>Psychologist</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appt : ${appointments}">
                        <td th:text="${appt.dateHour}">2025-01-15T10:00</td>
                        <td th:text="${appt.patient != null ? appt.patient.fName + ' ' + appt.patient.lName : '—'}">John Doe</td>
                        <td th:text="${appt.psychologist != null ? appt.psychologist.fName + ' ' + appt.psychologist.lName : '—'}">Alice Morgan</td>
                        <td th:text="${appt.notes}">First consult</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
