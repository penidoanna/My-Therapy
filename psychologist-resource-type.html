<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Manage ' + ${resourceType} + ' - My Therapy'">Manage Resources</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}"/>
    <style>
        body {
            background-color: #f9fafb;
        }
        .card-soft {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 6px 25px rgba(0, 0, 0, .05);
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold" th:text="'Manage ' + ${resourceType}"></h1>
                <p class="text-muted mb-0">Add and manage <span th:text="${resourceType.toLowerCase()}"></span> for your patients</p>
            </div>
            <div>
                <a th:href="@{/psychologist/resources}" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-arrow-left me-2"></i>All Resources
                </a>
                <a th:href="@{/psychologist/dashboard}" class="btn btn-outline-primary">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- Add Resource Form -->
            <div class="col-lg-4">
                <div class="card card-soft mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Add New <span th:text="${resourceType.substring(0, resourceType.length()-1)}"></span></h5>
                        <form th:action="@{/psychologist/resources/create}" method="post">
                            <input type="hidden" name="resourceType" th:value="${resourceType.substring(0, resourceType.length()-1)}">
                            
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" name="title" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Subject</label>
                                <select class="form-select" name="subject" required>
                                    <option value="">Select Subject</option>
                                    <option value="mindfulness">Mindfulness</option>
                                    <option value="anxiety">Anxiety</option>
                                    <option value="relationship">Relationship</option>
                                    <option value="sleep">Sleep</option>
                                    <option value="stress">Stress</option>
                                    <option value="focus">Focus</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" name="description" rows="3" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Duration/Pages</label>
                                <input type="text" class="form-control" name="duration" placeholder="e.g., 15 min or 120 pages" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Resource URL</label>
                                <input type="url" class="form-control" name="url" placeholder="https://..." required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-plus me-2"></i>Add Resource
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Existing Resources -->
            <div class="col-lg-8">
                <div class="card card-soft">
                    <div class="card-body">
                        <h5 class="card-title">Existing <span th:text="${resourceType}"></span></h5>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Subject</th>
                                        <th>Duration</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="resource : ${resources}">
                                        <td th:text="${resource.title}">Title</td>
                                        <td>
                                            <span class="badge bg-secondary" th:text="${resource.subject}">Subject</span>
                                        </td>
                                        <td th:text="${resource.duration}">Duration</td>
                                        <td>
                                            <a th:href="@{/resources/{type}s/{id}(type=${resource.type}, id=${resource.id})}" 
                                               class="btn btn-sm btn-outline-primary me-1">View</a>
                                            <form th:action="@{/psychologist/resources/{id}/delete(id=${resource.id})}" 
                                                  method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" 
                                                        onclick="return confirm('Are you sure you want to delete this resource?')">
                                                    Delete
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(resources)}">
                                        <td colspan="4" class="text-center text-muted py-4">
                                            <i class="fas fa-inbox fa-2x mb-2"></i>
                                            <p>No <span th:text="${resourceType.toLowerCase()}"></span> found</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top bg-white py-3 mt-5">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="text-muted">&copy; <span th:text="${#dates.year(#dates.createNow())}">2025</span> My Therapy</span>
            <span class="text-muted small">Built with Spring Boot &amp; PostgreSQL</span>
        </div>
    </footer>

    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
