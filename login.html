<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Log in – My Therapy</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
        <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}"/>
    </head>
    <body class="bg-light">       
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="container py-5">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="text-center mb-4">
                        <a th:href="@{/}" class="text-decoration-none text-dark">
                            <i class="fa-solid fa-heart-pulse me-2 text-primary"></i>
                            <span class="fw-bold">My Therapy</span>
                        </a>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <h1 class="h4 fw-bold mb-3 text-center">Log in</h1>
                            <p class="text-muted small text-center mb-4">
                                Access your account as a patient or psychologist.
                            </p>

                            <form method="post" th:action="@{/login}">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="username" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label d-flex justify-content-between">
                                        <span>Password</span>
                                        <a href="#" class="small">Forgot password?</a>
                                    </label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>

                                <button class="btn btn-primary w-100" type="submit">
                                    Log in
                                </button>
                            </form>
                        </div>

                        <div class="card-footer text-center bg-white">
                            <small class="text-muted">
                                New to My Therapy?
                                <a th:href="@{/patients/create}">Register as a patient</a>
                                or
                                <a th:href="@{/psychologists/create}">Register as a psychologist</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
